[package]
name = "engineering-challenge"
version = "0.1.0"
edition = "2024"
build = "src/util/build.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
crossbeam = "0.8.4"
thiserror = "2"

clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"
polyfill-rs = "0.4.3"
polymarket_client_sdk_v2 = { version = "0.8.0", features = ["gamma", "ws","clob"] }
rust_decimal = { version = "1.41.0", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "http2", "system-proxy", "rustls-no-provider"] }
rust_decimal_macros = "1.40.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# WebSocket client for our custom shard
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
futures-util = "0.3"
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
rand = "0.8"


[build-dependencies]
ergo-sbe = "=0.1.16"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.9"
